name: Security Audit & Android APK Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-audit:
    name: Secret, OpSec & Manifest Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for leaked secrets, private URLs, keystores, and cleartext traffic
        shell: bash
        run: |
          set -euo pipefail
          FAIL=0

          # 1. Check for forbidden credential/keystore filenames
          BAD_FILES=$(git ls-files | grep -E '\.(jks|keystore|p12|pfx|key|pem)$|(^|/)(local\.properties|keystore\.properties|\.env(\..*)?|google-services\.json)$' || true)
          if [ -n "$BAD_FILES" ]; then
            echo "::error::Forbidden credential/keystore/env files committed:"
            echo "$BAD_FILES"
            FAIL=1
          fi

          # 2. Scan tracked text files for leaked tokens, private keys, or studio URLs
          SECRET_PAT="(ghp_[0-9A-Za-z_]{20,}|gho_[0-9A-Za-z_]{20,}|github_pat_[0-9A-Za-z_]{20,}|AIza[0-9A-Za-z_-]{35}|sk-[0-9A-Za-z]{20,}|-----BEGIN [A-Z ]+PRIVATE KEY-----|aistudio\.google\.com/apps/)"
          if git grep -nI -E "$SECRET_PAT" -- . ':!.github/workflows/security-and-android-ci.yml' ':!scripts/publish_to_github.ps1'; then
            echo "::error::Potential secret, private key, or private AI Studio URL detected!"
            FAIL=1
          fi

          # 3. Verify no AndroidManifest enables cleartext HTTP traffic
          CLEARTEXT_PAT='usesCleartextTraffic[[:space:]]*=[[:space:]]*"true"'
          if git grep -nI -E "$CLEARTEXT_PAT" -- '*.xml'; then
            echo "::error::AndroidManifest.xml must not enable usesCleartextTraffic=\"true\"!"
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "Security audit passed cleanly."

  build-android-apps:
    name: Build Android Debug APKs
    needs: security-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover Android projects
        id: discover
        shell: bash
        run: |
          PROJECTS=$(find days -maxdepth 3 -path 'days/*/android_project/build.gradle*' -exec dirname {} \; | sort -u || true)
          if [ -z "$PROJECTS" ]; then
            echo "has_projects=false" >> "$GITHUB_OUTPUT"
            echo "No android_project directories found yet; skipping Gradle build."
          else
            echo "has_projects=true" >> "$GITHUB_OUTPUT"
            echo "projects<<EOF" >> "$GITHUB_OUTPUT"
            echo "$PROJECTS" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.discover.outputs.has_projects == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        if: steps.discover.outputs.has_projects == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APKs
        if: steps.discover.outputs.has_projects == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts_out
          while IFS= read -r proj; do
            [ -z "$proj" ] && continue
            day_name=$(basename "$(dirname "$proj")")
            echo "Building $day_name ($proj)..."
            pushd "$proj" >/dev/null
            if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew assembleDebug --no-daemon
            else
              gradle assembleDebug --no-daemon
            fi
            popd >/dev/null
            find "$proj" -name "*-debug.apk" -exec cp {} "artifacts_out/${day_name}-debug.apk" \;
          done <<< "${{ steps.discover.outputs.projects }}"

      - name: Upload APK Artifacts
        if: steps.discover.outputs.has_projects == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-android-debug-apks
          path: artifacts_out/*.apk
          if-no-files-found: warn
